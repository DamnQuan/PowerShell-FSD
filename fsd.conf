###############################################################################
# Sample configuration file for PowerShell-FSD
#
# The file format follows the classic FSD configuration layout.

# [system]
#   clientport / serverport / systemport : listening ports
#   ident     : unique server identification code (keep it short)
#   email     : maintainer e-mail address
#   name      : description of your server
#   hostname  : hostname or IP of this server
#   password  : password for privileged commands on the system port
#   location  : physical location of the server
#   mode      : 'normal' or 'silent' (feed only)
#   certificates : file to read certificates from
#   maxclients : maximum amount of clients
#   whazzup   : file to write WhazzUp data to

[system]
clientport=6809
serverport=3011
systemport=3010
ident=FSD
email=nobody@nowhere.com
name=PowerShell-FSD sample server
hostname=localhost
password=disable
location=Nowhere
mode=normal
certificates=cert.txt
maxclients=200
whazzup=whazzup.txt

###############################################################################
# [connections]
#   connectto : comma separated list of host:port to link with
#               e.g. connectto=fsd1.example.com:3011,fsd2.example.com:3011
#   allowfrom : comma separated list of hosts allowed on the server port

[connections]
#connectto=
#allowfrom=

###############################################################################
# [hosts]
#   certificates : server idents allowed to change certificates
#   weather      : server idents allowed to change weather profiles
#[hosts]
#certificates=
#weather=

###############################################################################
# [weather]
#   source : network | file | download
#     network  - relay METAR requests to the nearest METAR capable server
#     file     - serve METAR from the local metar.txt
#     download - like file, refreshes metar.txt hourly over FTP
#   server / dir / ftpmode are only used with source=download

[weather]
source=network
#server=weather.noaa.gov
#dir=data/observations/metar/cycles/
#ftpmode=passive
